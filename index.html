<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta No Secret</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e6e0f8 0%, #f3f0fc 100%);
            background-color: #e6e0f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        .diagonal-stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 0, 0, 0.04),
                rgba(0, 0, 0, 0.04) 20px,
                transparent 20px,
                transparent 40px
            );
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(100, 80, 140, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-size: 2.2rem;
            color: #2b233d;
            margin-bottom: 25px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #6c5ce7;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            margin: 15px 0;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #5b4bc4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="diagonal-stripes"></div>
    <div class="container">
        <h1>delta no secret</h1>
        
        <!-- Nút 1 -->
        <a href="itms-services://?action=download-manifest&amp;url=https://delta.bz/manifest.plist" class="btn">
            delta link 1 [free]
        </a>
        
        <!-- Nút 2 -->
        <a href="itms-services://?action=download-manifest&amp;url=https://delta.bz/manifest.plist" class="btn">
            delta link 2 [free]
        </a>
    </div>
</body>
</html>
